<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrumboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<section id="login-view" class="auth-wrap">
  <form class="auth-card" id="login-form">
    <h1>Scrumboard</h1>
    <p class="muted">Gestión de usuarios, grupos y tareas</p>
    <label>Email<input type="email" name="email" required placeholder="admin@scrumboard.local"></label>
    <label>Contraseña<input type="password" name="password" required placeholder="••••••••"></label>
    <button type="submit" class="btn primary">Ingresar</button>
    <p class="error" id="login-error"></p>
    <p class="hint">Primer usuario: <code>admin@scrumboard.local</code> / <code>admin123</code></p>
  </form>
</section>

<!-- APP -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="brand">Scrum<span>board</span></div>
    <nav class="tabs">
      <button class="tab active" data-view="board">Tablero</button>
      <button class="tab admin-only" data-view="groups">Grupos</button>
      <button class="tab admin-only" data-view="users">Usuarios</button>
    </nav>
    <div class="user-box">
      <span class="role-badge" id="role-badge"></span>
      <span id="user-name"></span>
      <button class="btn ghost" id="logout">Salir</button>
    </div>
  </header>

  <main>
    <!-- TABLERO -->
    <section id="view-board">
      <div class="board-head">
        <h2>Tablero</h2>
        <div class="board-actions">
          <select id="board-select" class="select"></select>
          <input id="new-column" class="input" placeholder="Nueva columna" style="display:none">
          <button class="btn ghost admin-scm-only" id="add-column">+ Columna</button>
          <button class="btn primary" id="new-task">+ Tarea</button>
        </div>
      </div>
      <div id="board" class="board"></div>
    </section>

    <!-- GRUPOS -->
    <section id="view-groups" class="hidden">
      <div class="board-head">
        <h2>Grupos de trabajo</h2>
        <div class="board-actions">
          <input id="new-group" class="input" placeholder="Nombre del grupo">
          <button class="btn primary admin-only" id="add-group">+ Crear grupo</button>
        </div>
      </div>
      <div id="groups" class="grid"></div>
    </section>

    <!-- USUARIOS -->
    <section id="view-users" class="hidden">
      <div class="board-head">
        <h2>Usuarios</h2>
        <div class="board-actions">
          <input id="new-user-name" class="input" placeholder="Nombre">
          <input id="new-user-email" class="input" placeholder="Email">
          <input id="new-user-pass" class="input" type="password" placeholder="Contraseña">
          <select id="new-user-role" class="select">
            <option value="OPERADOR">Operador</option>
            <option value="SCRUMMASTER">ScrumMaster</option>
            <option value="ADMINISTRADOR">Administrador</option>
          </select>
          <button class="btn primary" id="add-user">+ Crear usuario</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Grupo</th><th></th></tr>
          </thead>
          <tbody id="users-table"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- MODAL TAREA -->
<div id="task-modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="task-modal-title">Nueva tarea</h3>
    <label>Título<input id="task-title" class="input"></label>
    <label>Descripción<textarea id="task-desc" rows="3" class="input"></textarea></label>
    <div class="row">
      <label>Columna<select id="task-column" class="select"></select></label>
      <label>Prioridad
        <select id="task-priority" class="select">
          <option value="BAJA">Baja</option>
          <option value="MEDIA">Media</option>
          <option value="ALTA">Alta</option>
        </select>
      </label>
    </div>
    <label>Asignado a<select id="task-assignee" class="select"></select></label>
    <div class="modal-actions">
      <button class="btn ghost" id="task-cancel">Cancelar</button>
      <button class="btn primary" id="task-save">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL MIEMBROS -->
<div id="member-modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="member-modal-title">Miembros</h3>
    <div id="member-list" class="member-list"></div>
    <div class="row">
      <select id="member-user" class="select"></select>
      <button class="btn primary" id="member-add">Agregar</button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="member-close">Cerrar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
